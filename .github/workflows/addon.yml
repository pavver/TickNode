name: Home Assistant add-on image

# Builds the add-on images natively for both architectures Home Assistant supports (amd64, aarch64).
# Pull requests and manual runs only check that the images build.
# A pushed tag `vX.Y.Z` publishes ghcr.io/pavver/ticknode-{arch}:X.Y.Z (and :latest); the tag must
# match `version` in ha-addon/ticknode/config.yaml (scripts/release.sh keeps them in step).
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "ha-addon/**"
      - ".github/workflows/addon.yml"
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: version
        run: |
          version="$(sed -n 's/^version: *"\(.*\)"/\1/p' ha-addon/ticknode/config.yaml)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF_NAME#v}" != "$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match config.yaml version $version"
            exit 1
          fi
      - uses: docker/setup-buildx-action@v3
      - name: Log in to ghcr.io
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ha-addon/ticknode
          file: ha-addon/ticknode/Dockerfile
          # Build the checked-out workspace instead of cloning master from GitHub.
          build-contexts: source=.
          platforms: ${{ matrix.platform }}
          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.version }}
            BUILD_ARCH=${{ matrix.arch }}
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: |
            ghcr.io/pavver/ticknode-${{ matrix.arch }}:${{ steps.version.outputs.version }}
            ghcr.io/pavver/ticknode-${{ matrix.arch }}:latest
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
