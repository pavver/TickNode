[package]
name = "ticknode-editor"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"

[dependencies]
ticknode-shared = { path = "../ticknode-shared" }
chrono = { workspace = true }
postcard = { workspace = true, features = ["alloc"] }
serde = { workspace = true }
serde_json = "1.0"
leptos = { version = "0.8.22", features = ["csr"] }
wasm-bindgen = "0.2.100"
js-sys = "0.3.77"
console_error_panic_hook = "0.1.7"
web-sys = { version = "0.3.77", features = [
    "WebSocket", "MessageEvent", "BinaryType", "CloseEvent", "Location", "Url", "Storage",
    "PointerEvent", "WheelEvent", "KeyboardEvent", "DomRect", "Element", "HtmlElement",
    "Document", "Window", "HtmlInputElement", "HtmlDocument", "ClipboardEvent", "DataTransfer",
    "NodeList", "Navigator", "ScrollIntoViewOptions", "ScrollLogicalPosition",
] }
uuid = { workspace = true }
fluent-bundle = "0.16.0"
fluent-syntax = "0.12.0"
unic-langid = "0.9.6"

[dev-dependencies]
any_spawner = { version = "0.3", features = ["futures-executor"] }

# Native geometry tests exercise the actual plugin definitions without a WASM host or TCP.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
ha-plugin = { path = "../ha-plugin" }
ticknode-plugin-sdk = { path = "../ticknode-plugin-sdk" }
