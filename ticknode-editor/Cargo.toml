[package]
name = "ticknode-editor"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"

[dependencies]
ticknode-shared = { path = "../ticknode-shared" }
postcard = { workspace = true, features = ["alloc"] }
serde = { workspace = true }
serde_json = "1.0"
leptos = { version = "0.8.22", features = ["csr"] }
wasm-bindgen = "0.2.100"
js-sys = "0.3.77"
console_error_panic_hook = "0.1.7"
web-sys = { version = "0.3.77", features = [
    "WebSocket", "MessageEvent", "BinaryType", "CloseEvent", "Location", "Url", "Storage",
    "PointerEvent", "WheelEvent", "KeyboardEvent", "DomRect", "Element", "HtmlElement",
    "Document", "Window", "HtmlInputElement", "HtmlDocument", "ClipboardEvent", "DataTransfer",
    "NodeList",
] }
uuid = { workspace = true }
